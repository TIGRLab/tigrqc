<!-- Present a file lazy-loaded file tree so a directory can be chosen -->
{% extends "base.html" %}

{% block content %}
<div class="card">
  <div class="card-header">Select a data directory:</div>
  <div class="card-body p-2" id="tree-root"
       hx-get="{{ url_for('main.list_data_dirs') }}" hx-trigger="load" hx-swap="innerHTML">
  </div>
</div>

<form method="post" action="{{ url_for('main.select_path') }}" class="mt-3 d-flex align-items-center gap-2">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" id="selected-path" name="path">
  <span class="text-muted small">
    Selected: <span id="selected-path-display">none</span>
  </span>
  <button id="submit-btn" type="submit" class="btn btn-primary btn-sm" disabled>
    Use this directory
  </button>
</form>

<script>

  function selectDirectory(path, el) {
    document.querySelectorAll('.dir-label.selected')
      .forEach(e => e.classList.remove('selected', 'bg-primary', 'text-white'));
    el.classList.add('selected', 'bg-primary', 'text-white');

    document.getElementById('selected-path').value = path;
    document.getElementById('selected-path-display').textContent = path;
    document.getElementById('submit-btn').disabled = false;
  }

  document.addEventListener('shown.bs.collapse', e => {
    e.target.previousElementSibling?.querySelector('.toggle-btn i')?.classList.add('rotate');
  });
  document.addEventListener('hidden.bs.collapse', e => {
    e.target.previousElementSibling?.querySelector('.toggle-btn i')?.classList.remove('rotate');
  });

</script>

{% endblock %}
