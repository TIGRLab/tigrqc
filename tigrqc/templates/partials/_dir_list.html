<ul class="list-group list-group-flush {{ 'ps-3' if not root else '' }}">
    {% for dir_name, path in items.items() %}
        <li class="list-group-item d-flex align-items-center border-0 py-1 px-1">
            <button class="btn btn-sm btn-link text-decoration-none p-0 me-1 toggle-btn"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#children-{{ path | make_id }}"
                    hx-get="{{ url_for('main.list_data_subdirs') }}?path={{ path }}"
                    hx-target="#children-{{ path | make_id }}"
                    hx-swap="innerHTML"
                    hx-trigger="click once">
            <i class="bi bi-chevron-right"></i>
            </button>
            <span class="dir-label flex-grow-1 rounded px-1"
                role="button"
                data-path="{{ path }}"
                onclick="selectDirectory(this.dataset.path, this)">
            <i class="bi bi-folder2 text-warning me-1"></i>{{ dir_name }}
            </span>
        </li>
        <li class="list-group-item border-0 p-0 ps-4">
            <div class="collapse" id="children-{{ path | make_id }}"></div>
        </li>
    {% endfor %}
</ul>
