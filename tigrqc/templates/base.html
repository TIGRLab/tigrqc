<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TIGRQC</title>

        <!-- Bootstrap 5.3.8 -->
        <link href="/static/css/bootstrap.min.css" rel="stylesheet">
        <script src="/static/js/bootstrap.bundle.min.js" defer></script>

        <!-- Bootstrap-Icons 1.13.1 -->
        <link href="/static/css/bootstrap-icons.min.css" rel="stylesheet">

        <!-- HTMX 2.0.10 -->
        <script src="/static/js/htmx-2.0.10.min.js"></script>
        <script src="/static/js/htmx-ext-response-targets-2.0.4.js"></script>

        <!-- tigrqc custom css -->
        <link href="/static/css/tigrqc.css" rel="stylesheet">

        <link rel="icon" href="/static/favicon.ico">

        {% block header_scripts %}{% endblock %}
    </head>
    <body class="d-flex flex-column min-vh-100" hx-ext="response-targets">
        <header>
            <div id="alerts">
                {% include 'partials/_flash.html' %}
            </div>
            <nav class="navbar navbar-expand-lg sticky-top bg-primary-subtle">
                <div class="container-fluid">
                    <a class="navbar-brand" href="/">
                        {% if org_logo %}
                            <img alt="Logo" height="30" src="/static/images/{{ org_logo }}">
                        {% endif %}

                        {% if org_brand %}
                            <span>{{ org_brand }}</span>
                        {% endif %}
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="/">Home</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main class="flex-grow-1 d-flex flex-column">
            {% block content %}{% endblock %}
        </main>

        <footer>
            <nav class="navbar bg-primary-subtle">
                <div class="container-fluid">
                    <div id="copyright" class="w-100 text-end">
                        © {{ copyright }}, v{{ version }}
                    </div>
                </div>
            </nav>

            <script>
                /**
                 *  This is a fix for a focus race condition that occurs with
                 *  bootstrap when closing modals. Can be removed if later
                 *  versions fix it natively.
                **/
                document.addEventListener('hide.bs.modal', (event) => {
                    const focused = document.activeElement;
                    if (focused && event.target.contains(focused)) {
                        focused.blur();
                    }
                });
            </script>
        </footer>
    </body>
</html>
