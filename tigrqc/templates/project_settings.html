{% extends "base.html" %}
{% include "partials/_flash.html" %}

{% block content %}

<button
    type="button"
    class="btn btn-danger"
    data-bs-toggle="modal"
    data-bs-target="#deleteDangerModal"
    data-item-name="{{ project.id }}"
    data-delete-url="{{ url_for('main.delete_project', project_id=project.id) }}"
>
    <i class="bi bi-trash"></i> Delete Project
</button>

<!-- This should probably be refactored out to a partial as this
page grows and other pages need a 'delete confirmation' modal -->
<div
    id="deleteDangerModal"
    class="modal fade"
    tabindex="-1"
    aria-labelledby="deleteDangerModalLabel"
    aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <p class="text-muted">
          This will permanently delete <strong id="modal-item-name"></strong>
          and all associated data. This action cannot be undone.
        </p>

        <label class="form-label text-muted small">
          Type <strong id="modal-confirm-hint" class="text-body"></strong> to confirm
        </label>
        <input
          type="text"
          id="confirm-name-input"
          class="form-control"
          placeholder=""
          autocomplete="off"
        />
        <div id="confirm-feedback" class="form-text" style="min-height: 1.2em;"></div>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <form id="delete-form" method="POST" action="">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" id="delete-submit-btn" class="btn btn-danger" disabled>
            <i class="bi bi-trash me-1"></i>Delete
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript">
const deleteModal = document.getElementById('deleteDangerModal');

deleteModal.addEventListener('show.bs.modal', event => {
  const trigger = event.relatedTarget;
  const itemName = trigger.dataset.itemName;
  const deleteUrl   = trigger.dataset.deleteUrl;

  // Populate the modal text
  document.getElementById('modal-item-name').textContent = itemName;
  document.getElementById('modal-confirm-hint').textContent  = itemName;
  document.getElementById('delete-form').action = deleteUrl;

  // Reset state
  const input    = document.getElementById('confirm-name-input');
  const feedback = document.getElementById('confirm-feedback');
  const btn      = document.getElementById('delete-submit-btn');
  input.value    = '';
  input.placeholder = itemName;
  input.classList.remove('is-valid', 'is-invalid');
  feedback.textContent = '';
  btn.disabled = true;

  // Validation on each keystroke
  input.oninput = () => {
    const match = input.value === itemName;
    const empty = input.value === '';

    input.classList.toggle('is-valid',   match);
    input.classList.toggle('is-invalid', !match && !empty);

    feedback.className = match
      ? 'form-text text-success'
      : 'form-text text-danger';
    feedback.textContent = empty   ? ''
      : match ? '✓ Name matches'
      : resourceName.startsWith(input.value) ? 'Keep typing…'
      : 'Doesn\'t match — check the name';

    btn.disabled = !match;
  };
});

// Reset input when modal closes
deleteModal.addEventListener('hidden.bs.modal', () => {
  const input = document.getElementById('confirm-name-input');
  input.classList.remove('is-valid', 'is-invalid');
  input.value = '';
});
</script>
{% endblock %}
