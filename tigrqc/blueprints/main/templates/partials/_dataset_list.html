{% for item in project.datasets %}
    <div class="card mb-3 hover-parent">
        <div class="card-header">
            {{ item.path }}
        </div>
        <div class="card-body d-flex justify-content-between align-items-center">
            <div class="d-flex flex-column">
                <div class="text-nowrap">
                    <span class="text-muted small text-uppercase">ID:</span>
                    <span class="fw-semibold ms-1">{{ item.name_type }}</span>
                </div>
                <div class="text-nowrap">
                    <span class="text-muted small text-uppercase">Type:</span>
                    <span class="fw-semibold ms-1">{{ item.data_type }}</span>
                </div>
                <div class="text-nowrap">
                    <span class="text-muted small text-uppercase"># Sessions:</span>
                    <span class="fw-semibold ms-1">0</span>
                </div>
            </div>

            <button class="btn btn-danger hover-reveal flex-shrink-0">
                <i class="bi bi-trash3"></i>
            </button>
        </div>
    </div>
{% endfor %}
