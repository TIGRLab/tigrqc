<div class="modal fade" id="addDatasetModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add a data directory to {{ project.id }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <div id="file-tree"></div>
                <form
                    id="selected-dir"
                    method="POST"
                    action="{{ url_for('main.project_settings', project_id=project.id) }}"
                    autocomplete="off"
                >
                    {{ render_form(dataset_form) }}
                    <button type="submit" id="dir-submit-btn" class="btn btn-primary">
                        Add dataset
                    </button>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary">Save changes</button>
            </div>
        </div>
    </div>
</div>
