# Make this simpler. Take just the regex, then in code wrap it in group.
# Make clear in documentation that each defined item must have a unique name.
# ... can't. Too much potential for fuckup?
fields:
  project_id: '[^_]+'
  site_id: '[^_]+'
  subid: '(?!PHA)[^_]+'
  # Gotta document that to mark something as a phantom you just need 'pha_tag'
  # to exist in the parsed output (doesn't matter what it evals to)
  pha_tag: 'PHA'
  pha_type: '[A-Z]{3}'
  pha_id: '[0-9]{4,8}'
  tp_num: '[^_]+'
  attempt: '(?!MR)(?!SE)[^_]+'
  tag: '[^_]+'
  series: '[^_]+'
  description: '[^_]+'

templates:
  short_id: '{project_id}_{site_id}_{subid}'
  med_id: '{short_id}_{tp_num}'
  long_id: '{med_id}_{attempt}'
  pha_subfield: '{pha_type}{pha_id}'
  pha_subid: '{pha_tag}_{pha_subfield}'
  phantom_id: '{project_id}_{site_id}_{pha_subid}'
  sub_fname: '{long_id}_{tag}_{series}_{description}'
  pha_fname: '{phantom_id}_{tag}_{series}_{description}'


# Need a mapping between field/component names and database columns, if they
# don't match. Can duplicate (e.g. subid = subject_id and pha_subid = subject_id)
field_map:
  subid: subject_id
  pha_subfield: subject_id
  sub_fname: fname
  pha_fname: fname

# So... expose a dictionary of column names that need to be populated for a
# standalone dataset (timepoints only, series included... diff requirements)
# and make it clear to user they can use other names as long as they give mapping

validation:
    # These two validators should maybe be on the naming scheme and
    # get applied to every dataset using the naming scheme
    # since the naming scheme determines whether phantoms exist
    # and whether site/study are even part of an ID.
    - use: validate_all_human_or_all_phantom_data
      scope:
        - series
      args: {}
      fail_message: >
        'Timepoint contains mix of phantom and human data. Should be one or the other.'

    - use: validate_id_fields_match_expected_values
      scope:
        - timepoint
        - series
      args:
        check_study: True
        check_site: True
      fail_message: >
        'Study or Site code in ID does not match the expected settings.'
