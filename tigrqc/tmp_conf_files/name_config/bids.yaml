fields:
    site_id: '[A-Z]{3}'
    subject_id: '[A-Z0-9]+'
    tp_num: '[0-9]{2}'
    data_type: '[a-z]*'
    entities: '(?:[A-Za-z0-9]+-[A-Za-z0-9]+_)*'
    suffix: '[A-Za-z0-9]+'

templates:
    subject: 'sub-{site_id}{subject_id}'
    session: 'ses-{tp_num}'
    fname: '{subject}_{session}_{entities}{suffix}'

validation:
    # Merges with the dataset config when its loaded + files are parsed.
    # This can probably do timepoint only... just to catch data that starts
    # misnamed
    # Also, allow user to toggle whether it's a hard fail or just a report
    # and keep working sort of situation...
    - use: validate_id_fields_match_expected_values
      scope:
        - timepoint
        - series
      args:
        check_site: True

# Allow mapping between defined field names and expected field names / synonyms
# so multiple regexes can supply same info. Must validate that every key in
# both sides of mapping is a real / expected name

# Don't require that naming convention supplies everything needed for
# subject-level/scan-level because dataset may supply some... just document
# what it supplies
