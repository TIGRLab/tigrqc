id: bids_raw
# Version might actually just be misleading if software version doesnt
# matter. I don't know.
version: 1.0.0
description: >
    Raw scan data generated by dcm2bids (any version). Import all scans and
    their sidecars.

timepoint_dir:
    - ['^{subject}$']
    - ['^{session}$', '^{data_type}$']

append_path:
    - ['^{data_type}$']

find:
    - label: dataset_description
      scope: dataset
      append_path: []
      pattern: '^dataset_description.json$'

    - label: raw_scan
      pattern: '^{fname}.nii*'

    - label: sidecar
      pattern: '^{fname}.json$'
      load_vals:
        format: json
        values:
          - keys: ['SeriesNumber']
            store: series

          - keys: ['SeriesDescription']
            store: description

    - label: bvec
      pattern: '^{fname}.bvec$'

    - label: bval
      pattern: '^{fname}.bval$'

# group_by:
#     - file_name

validation:

    # Be clearer that this just checking the optional ses/data_type layout
    # and finding the correct parent dir.
    # Maybe this is better as a post-processing step...
    - use: validate_bids_dir_structure
      scope:
        - timepoint_dir
      args:
        # Continue processing sessions even if bad directories / mix of datatype
        # and sessions exist
        pass_sessions: True
      # This is probably not needed actually
      fail_message: >
        'Invalid bids folder structure.'

    - use: validate_series_outputs
      scope:
        - series
      args:
        group_by: ['fname']
        required_labels: ['raw_scan', 'sidecar']
        share_fields: ['series', 'description']
    # - use: validate_nifti_and_sidecar_exist_per_series
    #   group_by: file_name

    # - use: validate_all_phantom_or_all_subject_data
    #   fail_message: >
    #     'Subject contains mix of phantom and human data. Should be one or the other'

